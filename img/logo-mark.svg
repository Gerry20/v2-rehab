<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="v2t">
  <title id="v2t">V2 Rehab mark</title>
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F22D35"/>
      <stop offset="1" stop-color="#A5121A"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EDEFF3"/>
      <stop offset=".55" stop-color="#B7BDC7"/>
      <stop offset="1" stop-color="#868D99"/>
    </linearGradient>
    <linearGradient id="redFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F22D35"/>
      <stop offset="1" stop-color="#C81A21"/>
    </linearGradient>
  </defs>

  <circle cx="50" cy="50" r="48" fill="#0B0B0C"/>
  <circle cx="50" cy="50" r="46.4" fill="none" stroke="url(#ring)" stroke-width="2.2"/>

  <!-- "2" set back-right, steel -->
  <text x="66" y="70" font-family="Arial, Helvetica, sans-serif" font-weight="800"
        font-size="46" fill="url(#steel)" text-anchor="middle" opacity=".92">2</text>

  <!-- V mark: left arm -->
  <path d="M 25 27 L 47 68" fill="none" stroke="url(#redFill)"
        stroke-width="10.5" stroke-linecap="round"/>
  <!-- V mark: right arm sweeping into a reaching figure -->
  <path d="M 47 68 C 51 54 55 42 60 33" fill="none" stroke="url(#redFill)"
        stroke-width="10.5" stroke-linecap="round"/>
  <path d="M 60 33 C 63 26 67 21 73 17" fill="none" stroke="url(#redFill)"
        stroke-width="6.5" stroke-linecap="round"/>
  <!-- head -->
  <circle cx="78" cy="14" r="7.4" fill="url(#redFill)"/>
</svg>
